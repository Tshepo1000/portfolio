<main class="wrap">
  <div class="contact-hero">
    <p class="eyebrow" data-reveal>Contact</p>
    <h1 data-reveal>Let's talk</h1>
    <p style="margin-top:22px;" data-reveal>
      <a href="mailto:tshepotubatsi@gmail.com" class="contact-mail u-link">tshepotubatsi@gmail.com</a>
    </p>
  </div>

  <div class="contact-grid">
    <div class="info-col" data-reveal>
      <div class="info-row"><span class="k">Location</span><span>Gauteng, South Africa</span></div>
      <div class="info-row"><span class="k">Mobile</span><a href="tel:+27787172792">078 717 2792</a></div>
      <div class="info-row"><span class="k">GitHub</span><a href="https://github.com/Tshepo1000" target="_blank" rel="noopener">github.com/Tshepo1000</a></div>
      <div class="info-row"><span class="k">LinkedIn</span><a href="https://linkedin.com/in/tshepo-sekete-154094157" target="_blank" rel="noopener">tshepo-sekete</a></div>
    </div>

    <!-- Web3Forms access key (public by design): get one free at https://web3forms.com -->
    <form class="min-form" id="contactForm" data-access-key="89a57d31-8f5c-4240-9fcf-fcd16ef4868c" data-reveal>
      <input type="checkbox" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="What would you like to talk about?"></textarea>
      </div>
      <button type="submit" class="submit-btn"><span class="u-link">Send message</span></button>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
